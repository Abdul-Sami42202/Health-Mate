<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthMate - Sign Up / Account Banayein</title>

    <link rel="stylesheet" href="./src/signup.css">

    <link rel="shortcut icon" href="./public/Assets/favicon.svg" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Decorative background elements -->
    <div class="background-decoration" aria-hidden="true">
        <div class="decoration decoration-primary"></div>
        <div class="decoration decoration-tertiary"></div>
    </div>

    <main class="signup-container">

        <div class="signup-header">

            <div class="brand">
                <div class="logo-icon">
                    <span class="material-symbols-outlined">
                        ecg_heart
                    </span>
                </div>

                <h1>HealthMate</h1>
            </div>

            <p>Create Account / Account Banayein</p>

        </div>

        <!-- Registration Card -->
        <div class="signup-card">

            <form id="signupForm">

                <!-- Full Name -->
                <div class="form-group">
                    <label for="fullName">Full Name / Pura Naam</label>

                    <div class="input-wrapper">
                        <span class="material-symbols-outlined input-icon">person</span>
                        <input
                            id="fullName"
                            name="fullName"
                            type="text"
                            placeholder="John Doe"
                            required >
                    </div>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email Address / Email Pata</label>

                    <div class="input-wrapper">
                        <span class="material-symbols-outlined input-icon">mail</span>
                        <input
                            id="email"
                            name="email"
                            type="email"
                            placeholder="johndoe@example.com"
                            required
                        >
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password / Password</label>

                    <div class="input-wrapper">
                        <span class="material-symbols-outlined input-icon">lock</span>
                        <input
                            id="password"
                            name="password"
                            type="password"
                            placeholder="••••••••"
                            required
                        >

                        <button
                        type="button"
                        class="password-toggle"
                        aria-label="Toggle password visibility"
                        >
                        <span class="material-symbols-outlined">
                            visibility_off
                        </span>
                    </button>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password / Password Tasdeeq</label>

                    <div class="input-wrapper">
                        <span class="material-symbols-outlined input-icon">lock_reset</span>
                        <input
                            id="confirmPassword"
                            name="confirmPassword"
                            type="password"
                            placeholder="••••••••"
                            required
                        >

                        <button
                        type="button"
                        class="confirm-password-toggle"
                        aria-label="Toggle confirm password visibility"
                        >
                        <span class="material-symbols-outlined">
                            visibility_off
                        </span>
                    </button>
                    </div>
                </div>

                <!-- Agreements -->
                <div class="agreements">

                    <div class="agreement">
                        <input id="terms" name="terms" type="checkbox" required>

                        <label for="terms">
                            I agree to the
                            <a href="#">Terms &amp; Conditions</a> /
                            <br>
                            Main sharaait-o-zawaabit se ittefaq karta/karti hoon.
                        </label>
                    </div>

                    <div class="agreement">
                        <input id="disclaimer" name="disclaimer" type="checkbox" required>

                        <label for="disclaimer">
                            I acknowledge the
                            <a href="#">Medical Disclaimer</a> /
                            <br>
                            Main tibbi dastbardari ko tasleem karta/karti hoon.
                        </label>
                    </div>

                </div>

                <!-- Submit -->
                <div class="submit-wrapper">
                    <button class="signup-button" type="submit">
                        Sign Up / Account Banayein
                    </button>
                </div>

            </form>

            <!-- Footer Links -->
            <div class="signin-link">
                <p>
                    Already have an account? / Pehle se account hai?
                    <a href="./signin.html">Sign In / Log In Karein</a>
                </p>
            </div>

        </div>

    </main>

    <script type="module" src="./src/signup.js"></script>
</body>
</html>
